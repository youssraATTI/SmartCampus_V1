# TP4 — api + PostgreSQL (services joignables par nom DNS: postgres)
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartcampus:1.0
    container_name: smartcampus-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SMARTCAMPUS_DB_URL: jdbc:postgresql://postgres:5432/smartcampus
      SMARTCAMPUS_DB_USER: smartcampus
      SMARTCAMPUS_DB_PASSWORD: smartcampus
      SMARTCAMPUS_JWT_SECRET: change-me-docker-dev
    volumes:
      - api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f app.jar >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres-data:
  api-logs: