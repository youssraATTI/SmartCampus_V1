# SC-78 — secrets via variables d'environnement (ne jamais committer .env)
spring.application.name=smartcampus

server.port=${SERVER_PORT:8080}

smartcampus.datasource.url=${SMARTCAMPUS_DB_URL:jdbc:h2:mem:smartcampus}
smartcampus.datasource.username=${SMARTCAMPUS_DB_USER:sa}
smartcampus.datasource.password=${SMARTCAMPUS_DB_PASSWORD:}

smartcampus.auth.jwt-secret=${SMARTCAMPUS_JWT_SECRET:change-me-in-production}
smartcampus.auth.max-failed-attempts=${SMARTCAMPUS_MAX_FAILED_ATTEMPTS:3}
